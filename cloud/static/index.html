<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Screen Share</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px sans-serif;color:#fff}
video{width:100%;height:100%;object-fit:contain}
#bar{position:fixed;top:8px;right:8px;background:#000b;padding:6px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
select,button,input{background:#222;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 8px;font:inherit}
#m{position:fixed;top:8px;left:8px;background:#000b;padding:4px 8px;border-radius:4px}
#login{position:fixed;inset:0;display:flex;gap:8px;align-items:center;justify-content:center;background:#000}</style>
<video id=v autoplay muted playsinline></video><div id=m>connecting...</div>
<div id=login hidden><input id=pw type=password placeholder=Password autofocus><button id=go>Watch</button></div>
<div id=bar>
 <label>Resolution <select id=scale><option value=0>Native<option value=1920>1080p<option value=1280>720p<option value=854>480p</select></label>
 <label>FPS <select id=fps><option>15<option>30<option>60</select></label>
 <label>Bitrate <select id=bitrate><option value=2>2 Mbps<option value=4>4 Mbps<option value=8>8 Mbps<option value=15>15 Mbps</select></label>
 <button id=fs>Fullscreen</button></div>
<script>
const $=id=>document.getElementById(id),v=$('v'),m=$('m'),bar=$('bar');
const cfg=Object.assign({scale:1280,fps:30,bitrate:4},JSON.parse(localStorage.ss||'{}'));
for(const k in cfg)$(k).value=cfg[k];
let ws=null,pw=sessionStorage.pw||'',ms,sb,q=[],wantReset=false;
const send=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify(cfg));
for(const k in cfg)$(k).onchange=()=>{cfg[k]=+$(k).value;localStorage.ss=JSON.stringify(cfg);send()};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
let t;const wake=()=>{bar.classList.remove('hide');clearTimeout(t);t=setTimeout(()=>bar.classList.add('hide'),3000)};onmousemove=wake;wake();
const CODEC='video/mp4; codecs="avc1.640033"';
const status=s=>{m.style.display=s?'':'none';m.textContent=s};
function pump(){if(!sb||sb.updating||!q.length)return;try{sb.appendBuffer(q.shift())}catch(e){q.length=0}}
function resetPlayer(){q=[];sb=null;ms=new MediaSource();v.src=URL.createObjectURL(ms);
  ms.addEventListener('sourceopen',()=>{sb=ms.addSourceBuffer(CODEC);
    sb.onupdateend=()=>{const b=v.buffered;
      if(b.length){const end=b.end(b.length-1),beg=b.start(0);
        if(end-v.currentTime>0.4)v.currentTime=end-0.1;
        if(v.currentTime-beg>5&&!sb.updating){sb.remove(beg,v.currentTime-2);return}}
      pump()};pump()},{once:true})}
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/view?pw='+encodeURIComponent(pw));
  ws.binaryType='arraybuffer';resetPlayer();
  ws.onopen=()=>{$('login').hidden=true;send()};
  ws.onmessage=e=>{
    if(typeof e.data==='string'){status(e.data==='live'?'':'host offline - waiting for the PC agent...');return}
    const d=new Uint8Array(e.data),k=d[0];
    if(k===3){resetPlayer();return}
    q.push(d.subarray(1));pump()};
  ws.onclose=ev=>{status('disconnected, retrying...');setTimeout(connect,1500)};
  ws.onerror=()=>{};
}
// the browser doesn't expose the 401 on a failed WebSocket, so probe the password with a tiny HTTP-less trick:
async function tryLogin(){
  sessionStorage.pw=pw;
  const probe=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/view?pw='+encodeURIComponent(pw));
  probe.onopen=()=>{probe.close();connect()};
  probe.onerror=()=>{sessionStorage.removeItem('pw');$('login').hidden=false;status('wrong password')};
}
$('go').onclick=()=>{pw=$('pw').value;tryLogin()};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
pw?tryLogin():($('login').hidden=false,status(''));
</script>
